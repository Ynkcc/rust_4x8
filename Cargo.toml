[package]
name = "banqi_4x8"
version = "0.1.0"
edition = "2024"
authors = ["Your Name <your.email@example.com>"]
description = "4x8 Dark Chess game environment for reinforcement learning"
license = "MIT"

# 桌面 GUI（banqi-tauri）已拆分为独立 crate，见 src-tauri/
[workspace]
members = ["src-tauri", "crates/banqi-core"]

[lib]
name = "banqi_4x8"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "banqi"
path = "src/bin/banqi.rs"

[[bin]]
name = "banqi-data-collector"
path = "src/bin/data_collector.rs"
required-features = ["torch", "mongodb"]

# ── banqi-py-collector ─────────────────────────────────────────────────────
[[bin]]
name = "banqi-py-collector"
path = "src/bin/py_data_collector.rs"
required-features = ["pyo3"]

# ── banqi-collector ────────────────────────────────────────────────────────
# 统一采集进程（Collector）：LocalRegistry 模型热重载 + LocalEpisodeStore 落盘
[[bin]]
name = "banqi-collector"
path = "src/bin/collector.rs"
required-features = ["onnx"]

# ── banqi-selfplay-worker ──────────────────────────────────────────────────
# 评估器为纯神经网络（无启发式兜底），仅支持 torch 构建
[[bin]]
name = "banqi-selfplay-worker"
path = "src/bin/selfplay_worker.rs"
required-features = ["torch"]

[dependencies]
# 领域核心（游戏环境/MCTS/Expectimax/NNUE），规划拆出为独立仓库，见 docs/ARCHITECTURE.md §2.0
banqi-core = { path = "crates/banqi-core" }
rand = "0.8"
rand_distr = "0.4"
fixedbitset = "0.5"
ndarray = { version = "0.15", features = ["serde"] }
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
num_cpus = "1.17"
notify = "7"
flate2 = "1"
mongodb = { version = "3.8", optional = true }
bson = { version = "2.15", optional = true }
ctrlc = "3.4"

# 分布式 collector：R2 预签名 URL HTTP 上下行 + 内容 sha256 校验
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"

# gRPC 依赖 - 用于自对弈/Python 节点通信
tonic = "0.12"
prost = "0.13"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time", "net", "sync", "signal", "io-util", "fs"] }
futures = "0.3.34"
async-trait ="0.1.92"

# PyTorch 依赖 - 可选，用于本地训练和推理
tch = { version = "0.22", optional = true }

# ONNX Runtime 依赖 - 可选，用于 ONNX 模型推理服务（自对弈收集器 / banqi-tauri）。
# 启用 `onnx` feature 后构建时通过 download-binaries 下载预编译的 ONNX Runtime；
# 若想用 CUDA EP（onnx-cuda），还需本机安装 CUDA 工具链（库在运行时加载）。
ort = { version = "2.0.0-rc.13", features = ["download-binaries"], optional = true }

# PyO3 依赖 - 可选，用于 Python 集成
# 注意：extension-module 通过独立的 pyo3-extension feature 启用，
# 因为 banqi-py-collector（嵌入 Python 的独立二进制）需要链接 libpython，
# 而 maturin 构建的 cdylib 扩展模块不能链接 libpython。
pyo3 = { version = "0.29", features = [], optional = true }

[features]
# 默认不启用 torch 特性
default = []
# torch 特性：启用本地神经网络训练和推理
torch = ["tch"]
# pyo3 特性：启用 Python 集成
pyo3 = ["dep:pyo3"]
# pyo3 扩展模块特性：maturin 构建 cdylib wheel 时启用（不链接 libpython）
pyo3-extension = ["pyo3", "pyo3/extension-module"]
# 组合特性：Rust 持有模型的 Torch 数据收集器（RustTorchCollector）。
# 同时启用 torch + pyo3，才能在 Python 侧使用「模型加载进 Rust、推理不经过 GIL」的
# 多线程/批量自对弈收集器（见 src/py/rust_collector.rs）。
#   - maturin wheel：--features pyo3-extension,torch
#   - 本地 check：  cargo check --features pyo3,torch
rust-torch-collector = ["torch", "pyo3"]
# onnx 特性：ONNX Runtime 推理服务（src/onnx/mod.rs）。
# 供自对弈收集器（rust-onnx-collector）与 banqi-tauri（MctsOnnx 对手）使用。
# 构建时会下载预编译 ONNX Runtime 二进制（需网络）。
onnx = ["dep:ort"]
# onnx-cuda 特性：额外启用 ONNX Runtime CUDA EP（需本机 CUDA 库）。
# 与 download-binaries 搭配时下载 CUDA 版 ORT 二进制；不可用时自动回退 CPU。
onnx-cuda = ["onnx", "ort/cuda"]
# 组合特性：Rust 持有模型的 ONNX 数据收集器（RustOnnxCollector）。
# 与 RustTorchCollector 等价，但推理后端为 ONNX Runtime（不依赖 libtorch）。
#   - maturin wheel：--features pyo3-extension,onnx
rust-onnx-collector = ["onnx", "pyo3"]
# mongodb 特性：启用 MongoDB 存储后端（data_collector 使用）
mongodb = ["dep:mongodb", "dep:bson"]

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
# 用于测试和示例

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.release.build-override]
opt-level = 3

[profile.release.package."*"]
opt-level = 3
