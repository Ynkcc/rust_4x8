  MIN_SAMPLES_TO_START: 256
  QUEUE_FETCH_BATCH: 8
  DATA_AUGMENT_ENABLED: true
  DATA_AUGMENT_KEEP_ORIGINAL: true
  DATA_AUGMENT_TRANSFORMS: "hflip"
  MODEL_PATH: "mini_4x2/banqi_mini_model_latest.pt"
  STATE_DICT_PATH: "mini_4x2/banqi_mini_model_latest.pth"
  INFER_DEVICE: "cuda:0"
  TRAIN_DEVICE: "cuda:0"
