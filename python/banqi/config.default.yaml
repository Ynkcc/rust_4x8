# =============================================================================
# banqi 统一训练配置模板（4x2 / 4x4 / 4x8 共用）
# =============================================================================
# 注意：本文件仅作为生成 config.local.yaml 的「模板」，运行时不会被读取！
# 运行时的唯一配置来源是 config.local.yaml（被 .gitignore 忽略，不提交），
# 也可用环境变量 BANQI_CONFIG 指定其他 YAML 配置文件。
#
# 使用方式：
#   1. python -m banqi.config --write-template   # 生成 config.local.yaml
#   2. 编辑 config.local.yaml 中的参数
#   3. 运行训练脚本（环境变量优先级仍最高，可覆盖文件中的值）
#
# 配置优先级（从低到高）：
#   1. config.local.yaml（或 BANQI_CONFIG 指定文件）  <- 必需，无兜底
#   2. 环境变量                                       <- 最高优先
#
# 路径字段说明：
#   MODEL_PATH / STATE_DICT_PATH 为相对 python/ 目录的相对路径，
#   绝对路径也可直接用。
#   其余字段（TENSORBOARD_LOG_DIR 等）保持相对进程工作目录。
#
# 变体结构：每个变体一个顶层键（4x8 / 4x4 / 4x2），键下为字段名 -> 值。
# 每个变体都必须提供全部字段（缺少任一字段，make_config 会报错）。
# =============================================================================

4x8:
  # ---------------- 自对弈 ----------------
  PREDICT_BATCH: 128            # 批量推理 batch 大小
  MCTS_SIMS: 128                # 每次走子的 MCTS 模拟次数
  MAX_CONSIDERED_ACTIONS: 24    # 候选动作数上限
  TEMPERATURE_STEPS: 16         # 温度退火步数
  GAMES_PER_ITER: 100           # 每轮迭代对局数
  NUM_WORKERS: 2                # 自对弈 worker 数
  GAMES_PER_WORKER: 50          # 每个 worker 的对局数
  SELF_PLAY_PROCESSES: 2        # 自对弈进程数
  USE_BATCHED_SELF_PLAY: false  # 是否使用 batched 自对弈（GPU 下 batch 更大更占优）
  BATCH_CONCURRENCY: 8          # batched 自对弈并发度（仅 USE_BATCHED_SELF_PLAY=True 生效）

  # ---------------- 训练 ----------------
  TRAIN_BATCH: 64               # 训练 batch 大小
  LEARNING_RATE: 2.0e-4         # 初始学习率
  MIN_LR: 5.0e-6                # 学习率下限
  LR_DECAY_STEPS: 60000         # 学习率衰减步数
  TRAIN_EPOCHS_PER_ROUND: 3     # 每轮迭代训练 epoch 数
  WEIGHT_DECAY: 1.0e-4          # 权重衰减
  MAX_SAMPLE_BUFFER_SIZE: 100000  # 样本缓冲池大小
  MIN_SAMPLES_TO_START: 1000    # 开始训练所需最少样本数
  QUEUE_FETCH_BATCH: 8          # 队列批量抓取大小

  # ---------------- 数据增强 ----------------
  DATA_AUGMENT_ENABLED: true    # 是否启用数据增强
  DATA_AUGMENT_KEEP_ORIGINAL: true  # 增强时是否保留原始样本
  DATA_AUGMENT_TRANSFORMS: "hflip,vflip,rot180"  # 增强变换列表

  # ---------------- 模型与路径 ----------------
  MODEL_PATH: "banqi_model_latest.pt"     # 相对 python/ 目录
  STATE_DICT_PATH: "banqi_model_latest.pth"

  # ---------------- 设备 ----------------
  INFER_DEVICE: "cpu"           # 推理设备（cpu / cuda:0 / auto）
  TRAIN_DEVICE: "auto"          # 训练设备（cpu / cuda:0 / auto）
  INFER_CPU_AUX_WORKERS: 0      # CPU 辅助推理线程数
  INFER_CPU_FRACTION: 0.3       # CPU 推理线程占比
  INFER_MIN_SPLIT_BATCH: 16     # 拆分 batch 的最小规模

  # ---------------- 队列 ----------------
  DATA_QUEUE_MAXSIZE: 128       # 训练数据队列容量
  ARCHIVE_QUEUE_MAXSIZE: 256    # 归档队列容量

  # ---------------- 检查点 ----------------
  CHECKPOINT_EVERY_N_ROUNDS: 2  # 每 N 轮存一次检查点

  # ---------------- 监控 ----------------
  MONITOR_ENABLED: true         # 是否启用系统监控
  MONITOR_INTERVAL: 10.0        # 监控采样间隔（秒）
  MONITOR_PER_CORE: false       # 是否按核输出监控
  MONITOR_CSV_PATH: null        # 监控 CSV 输出路径（null=不输出）

  # ---------------- TensorBoard ----------------
  TENSORBOARD_ENABLED: true     # 是否启用 TensorBoard
  TENSORBOARD_LOG_DIR: "runs"   # 日志目录（相对工作目录）
  TENSORBOARD_LOG_SYS: true     # 是否记录系统指标

  # ---------------- Mongo 归档 ----------------
  MONGO_URI: "mongodb://localhost:27017"
  DB_NAME: "banqi_training"
  COLLECTION: "games"
  ARCHIVE_BATCH: 32             # 归档批量大小
  ARCHIVE_POLL_INTERVAL: 1.0    # 归档轮询间隔（秒）
  ARCHIVE_ENABLED: true         # 是否启用 Mongo 归档
  ARCHIVE_PREFILL_GAMES: 0      # 预填充归档对局数（0=不预填充）
  ARCHIVE_PREFILL_DIR: ""       # 预填充数据目录（空=不预填充）

  # ---------------- 运行时限 ----------------
  MAX_RUNTIME_SECONDS: 0        # 单次运行时限（秒），0 = 不限时

  # ---------------- 价值目标 ----------------
  VALUE_TARGET_MODE: "mcts"     # 价值目标模式（mcts / ...）
  VALUE_ANNEAL_START: 0.2       # 价值退火起始系数
  VALUE_ANNEAL_INCREMENT: 0.2   # 价值退火增量
  VALUE_ANNEAL_STEP_ROUNDS: 10  # 价值退火步进轮数
  VALUE_DRIFT_EVAL_ROUNDS: 0    # 价值漂移评估轮数（0=关闭）
  VALUE_DRIFT_NUM_POSITIONS: 0  # 价值漂移评估位置数

4x4:
  PREDICT_BATCH: 256
  MCTS_SIMS: 256
  MAX_CONSIDERED_ACTIONS: 16
  TEMPERATURE_STEPS: 12
  GAMES_PER_ITER: 40
  NUM_WORKERS: 4
  GAMES_PER_WORKER: 10
  SELF_PLAY_PROCESSES: 2
  USE_BATCHED_SELF_PLAY: true
  BATCH_CONCURRENCY: 16
  TRAIN_BATCH: 128
  LEARNING_RATE: 5.0e-4
  MIN_LR: 1.0e-5
  LR_DECAY_STEPS: 300000
  TRAIN_EPOCHS_PER_ROUND: 2
  WEIGHT_DECAY: 1.0e-4
  MAX_SAMPLE_BUFFER_SIZE: 16000
  MIN_SAMPLES_TO_START: 128
  QUEUE_FETCH_BATCH: 8
  DATA_AUGMENT_ENABLED: true
  DATA_AUGMENT_KEEP_ORIGINAL: true
  DATA_AUGMENT_TRANSFORMS: "hflip,vflip,rot180,rot90,rot270,diag,anti_diag"
  MODEL_PATH: "game_4x4/banqi4x4_model_latest.pt"
  STATE_DICT_PATH: "game_4x4/banqi4x4_model_latest.pth"
  INFER_DEVICE: "cuda:0"
  TRAIN_DEVICE: "cuda:0"
  INFER_CPU_AUX_WORKERS: 0
  INFER_CPU_FRACTION: 0.3
  INFER_MIN_SPLIT_BATCH: 16
  DATA_QUEUE_MAXSIZE: 256
  ARCHIVE_QUEUE_MAXSIZE: 256
  CHECKPOINT_EVERY_N_ROUNDS: 2
  MONITOR_ENABLED: true
  MONITOR_INTERVAL: 10.0
  MONITOR_PER_CORE: false
  MONITOR_CSV_PATH: null
  TENSORBOARD_ENABLED: true
  TENSORBOARD_LOG_DIR: "runs_4x4"
  TENSORBOARD_LOG_SYS: true
  MONGO_URI: "mongodb://localhost:27017"
  DB_NAME: "banqi_4x4"
  COLLECTION: "games"
  ARCHIVE_BATCH: 32
  ARCHIVE_POLL_INTERVAL: 1.0
  ARCHIVE_ENABLED: true
  ARCHIVE_PREFILL_GAMES: 400
  ARCHIVE_PREFILL_DIR: ""
  MAX_RUNTIME_SECONDS: 3600     # 1 小时
  VALUE_TARGET_MODE: "mcts"
  VALUE_ANNEAL_START: 0.2
  VALUE_ANNEAL_INCREMENT: 0.2
  VALUE_ANNEAL_STEP_ROUNDS: 10
  VALUE_DRIFT_EVAL_ROUNDS: 5
  VALUE_DRIFT_NUM_POSITIONS: 500

