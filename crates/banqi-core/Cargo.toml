[package]
name = "banqi-core"
version = "0.1.0"
edition = "2024"
description = "Banqi (Dark Chess) domain core: game environment, Gumbel MCTS, Expectimax search, NNUE"

[dependencies]
rand = "0.8"
rand_distr = "0.4"
ndarray = { version = "0.15", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
slab = "0.4"
